# Omarchy shell surfaces for Quattro Earth Tone.
# Forces the top bar to a solid black background as a theme signature.

[bar]
background       = "#000000"
background-alpha = 1.0
text             = "#FFFFFF"
active           = "#c06b5e"

# Popup and notification borders stay mauve (matching the window borders)
# instead of following the caramel accent.
[popups]
border           = "#937478"

[notifications]
border           = "#937478"
